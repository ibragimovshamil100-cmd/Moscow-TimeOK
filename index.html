<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Moscow Time</title>
</head>
<body><div class="page">
  <header>
    <div class="brand">◷ <span>MOSCOW</span> TIME</div>

    <div class="controls">
      <button id="format">24ч</button>
      <button id="language">RU</button>
    </div>
  </header>

  <main>
    <div class="kremlin">✧</div>
    <div class="location" id="location">МОСКВА, РОССИЯ</div>

    <div id="time">00:00:00</div>

    <div id="date">Загрузка...</div>

    <div class="separator">
      <span>★</span>
    </div>

    <div class="timezone">◎ MSK · UTC+3</div>
  </main>

  <footer>MOSCOW STANDARD TIME</footer>
</div><script src="script.js"></script>
</body>
</html
